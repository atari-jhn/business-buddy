function t(path, fallback) {
  const keys = path.split('.');
  let val = I18N[state.lang];
  for (const k of keys) {
    if (val && val[k] !== undefined) {
      val = val[k];
    } else {
      val = null;
      break;
    }
  }
  if (val !== null && val !== undefined) return val;
  // Fallback to English
  let eng = I18N['en'];
  for (const k of keys) {
    if (eng && eng[k] !== undefined) eng = eng[k];
    else return fallback || path;
  }
  return eng || fallback || path;
}

function getCategoryName(catName) {
  return t('categories.' + catName, catName);

function getCategoryModel(catName) {
  return CATEGORY_MODELS[catName] || CATEGORY_MODELS['Other'];
}

function calculateDynamicFeasibility(marginCapital, categoryName, radiusKm) {
  const model = getCategoryModel(categoryName);
  const r = Number(radiusKm) || 5;
  const margin = Number(marginCapital) || 100000;

  const projectCost = margin / 0.10;
  const loanReq = projectCost * 0.90;

  const areaSqKm = Math.PI * Math.pow(r, 2);
  const populationReach = Math.round(areaSqKm * 480);
  const totalHouseholds = Math.round(populationReach / 4.8);
  const targetCustomers = Math.round(totalHouseholds * model.targetPenetration);
  const nearbyMarkets = Math.max(2, Math.round(r * 0.65));
  const distributionPoints = Math.max(1, Math.round(nearbyMarkets * 0.7));

  const capitalSufficiency = Math.min(1.2, margin / model.minViableCapital);
  const capitalScore = Math.min(100, Math.round(capitalSufficiency * 82));
  const reachFactor = Math.min(1.2, r / 7.5);
  const reachScore = Math.min(100, Math.round(reachFactor * 85));
  const marginScore = Math.min(100, Math.round(model.operatingMargin * 250));

  let rawScore = (capitalScore * 0.40) + (reachScore * 0.30) + (marginScore * 0.30);
  const feasibilityScore = Math.min(94, Math.max(62, Math.round(rawScore)));

  let readinessTier = 'Highly Viable & Bank-Ready';
  let badgeClass = 'badge-green';
  let statusEmoji = '🟢';
  if (feasibilityScore < 70) {
    readinessTier = 'Viable (Requires Working Capital Buffer)';
    badgeClass = 'badge-blue';
    statusEmoji = '🟡';
  } else if (feasibilityScore < 80) {
    readinessTier = 'Viable with Structured Plan';
    badgeClass = 'badge-green';
    statusEmoji = '🟢';
  }

  const dynamicCompetitors = model.competitors.map(c => {
    const dist = (r * c.distRatio).toFixed(1);
    const price = Math.max(10, model.avgPrice + c.priceOffset);
    return {
      name: c.name,
      dist: dist + ' ' + t('common.km'),
      price: t('common.currency') + price,
      strength: c.strength,
      gap: c.gap
    };
  });

  const estMonthlyUnits = Math.round((targetCustomers * 3.5));
  const estMonthlyRevenue = Math.round(estMonthlyUnits * model.avgPrice);
  const estMonthlyOperatingCost = Math.round(estMonthlyRevenue * (1 - model.operatingMargin));
  const estMonthlyGrossProfit = estMonthlyRevenue - estMonthlyOperatingCost;

  return {
    category: model.name,
    categoryNameLocalized: getCategoryName(model.name),
    unitName: model.unitName,
    unitShort: model.unitShort,
    avgPrice: model.avgPrice,
    priceMin: model.priceMin,
    priceMax: model.priceMax,
    operatingMarginPct: Math.round(model.operatingMargin * 100),
    radiusKm: r,
    areaSqKm: Math.round(areaSqKm),
    populationReach,
    totalHouseholds,
    targetCustomers,
    nearbyMarkets,
    distributionPoints,
    feasibilityScore,
    readinessTier,
    badgeClass,
    statusEmoji,
    competitors: dynamicCompetitors,
    swot: model.swot,
    risks: model.risks,
    opportunityPoints: model.opportunityPoints,
    baseOpportunity: model.baseOpportunity,
    projections: {
      monthlyUnits: estMonthlyUnits,
      monthlyRevenue: estMonthlyRevenue,
      monthlyOperatingCost: estMonthlyOperatingCost,
      monthlyGrossProfit: estMonthlyGrossProfit
    }
  };
}

  if(low.includes('loan') || low.includes('how much')) return `Based on your margin capital of ${fmtINR(f.margin)}, your feasible project cost is ${fmtINR(f.projectCost)} and your eligible loan is ${fmtINR(f.loan)} under the ${f.scheme?f.scheme.name:'Term Loan Scheme'}.`;
  if(low.includes('scheme')) return `Your venture is matched to the ${f.scheme?f.scheme.name:'Term Loan Scheme'} at ${f.scheme?f.scheme.rate:8}% p.a. with a ${f.scheme?f.scheme.moratoriumMonths:6}-month moratorium.`;
  return `For your ${cat} venture in ${state.user.village || 'your village'}, BusinessBuddy calculates a Feasibility Score of ${dyn.feasibilityScore}/100 with a reach of ${dyn.populationReach.toLocaleString('en-IN')} people within ${state.assessment.radius} km.`;
}

function sendChat(text){
  if(!text) {
    const input = document.getElementById('chatInputBox');
    text = input.value.trim();
    if(!text) return;
    input.value='';
  }
  state.chatMessages.push({from:'user', text});
  state.chatMessages.push({from:'bot', text: chatReplyFor(text)});
  renderChat();
}

function renderChat(){
  const fab = document.getElementById('chatFab');
  if(fab) fab.innerHTML = state.chatOpen ? '' : `<button class="chat-fab" onclick="openChat()">💬 ${t('ai.headerTitle')}</button>`;
  const panel = document.getElementById('chatPanel');
  if(!panel) return;
  if(!state.chatOpen){ panel.innerHTML=''; return; }
  const msgs = state.chatMessages.map(m=>`<div class="msg ${m.from}">${m.text}</div>`).join('');
  const suggestions = (CHAT_SUGGESTIONS[state.lang] || CHAT_SUGGESTIONS['en']).slice(0, 3);
  
  panel.innerHTML = `
    <div class="chat-panel">
      <div class="chat-head">
        <div><div class="t">${t('ai.headerTitle')}</div><div class="s">${t('ai.headerSub')}</div></div>
        <button class="icon-btn" style="color:#fff;border-color:rgba(255,255,255,0.3);" onclick="closeChat()">✕</button>
      </div>
      <div class="chat-body" id="chatBody">${msgs}</div>
      <div class="chat-suggest">${suggestions.map(s=>`<button onclick="sendChat('${s.replace(/'/g,"\\'") }')">${s}</button>`).join('')}</div>
      <div class="chat-input-row">
        <input id="chatInputBox" type="text" placeholder="${t('ai.inputPlaceholder')}" onkeydown="if(event.key==='Enter')sendChat()">

function useCurrentLocation(){
  if(!navigator.geolocation){
    alert('Geolocation is not supported by your browser.');
    return;
  }
  const btn = document.getElementById('locBtn');
  if(btn) btn.innerHTML = t('common.detectingLocation');

  navigator.geolocation.getCurrentPosition(
    async (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      state.assessment.lat = lat;
      state.assessment.lng = lng;

      try {
        const resp = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`);
        const data = await resp.json();
        if(data && data.address){
          const addr = data.address;
          state.user.state = addr.state || state.user.state;
          state.user.district = addr.state_district || addr.county || addr.city || state.user.district;
          state.user.village = addr.village || addr.suburb || addr.town || addr.city_district || 'Detected Area';
          state.user.pinCode = addr.postcode || state.user.pinCode;

          const stEl = document.getElementById('a_state'); if(stEl) stEl.value = state.user.state;
          const dtEl = document.getElementById('a_district'); if(dtEl) dtEl.value = state.user.district;
          const vlEl = document.getElementById('a_village'); if(vlEl) vlEl.value = state.user.village;
          const pnEl = document.getElementById('a_pin'); if(pnEl) pnEl.value = state.user.pinCode;
        }
      } catch(err){
        console.log('Reverse geocoding fallback:', err);
      }

      if(btn) btn.innerHTML = t('common.locationUpdated');
      setTimeout(()=>{ if(btn) btn.innerHTML = t('common.useCurrentLocation'); }, 2000);
      initAssessmentMap();
    },
    (err) => {
      if(btn) btn.innerHTML = t('common.useCurrentLocation');
      state.user.state = 'Assam';
      state.user.district = 'Kamrup';
      state.user.village = 'Rani Village';
      state.user.pinCode = '781131';
      state.assessment.lat = 26.0618;
      state.assessment.lng = 91.6152;
      
      const stEl = document.getElementById('a_state'); if(stEl) stEl.value = state.user.state;
      const dtEl = document.getElementById('a_district'); if(dtEl) dtEl.value = state.user.district;
      const vlEl = document.getElementById('a_village'); if(vlEl) vlEl.value = state.user.village;
      const pnEl = document.getElementById('a_pin'); if(pnEl) pnEl.value = state.user.pinCode;
      
      initAssessmentMap();
      alert('Location detected via approximate network location: Kamrup, Assam (Demo).');
    },
    { timeout: 8000 }
  );
}

const SCHEMES = {
  micro:{ name:'Micro Finance Scheme', cap:125000, rate:6.5, tenureYears:3, moratoriumMonths:3, minCost:0, maxCost:140000 },
  term:{ name:'Term Loan Scheme', cap:4500000, rate:8, tenureYears:7, moratoriumMonths:6, minCost:140001, maxCost:5000000 }
};

function computeFinance(margin){
  const projectCost = margin / 0.10;
  let loanRequirement = projectCost * 0.90;
  let scheme, exceedsCap=false, cappedLoan=loanRequirement, outOfRange=false;

  if(projectCost <= SCHEMES.micro.maxCost){
    scheme = SCHEMES.micro;
  } else if(projectCost <= SCHEMES.term.maxCost){
    scheme = SCHEMES.term;
  } else {
    scheme = SCHEMES.term;
    outOfRange = true;
  }

  if(loanRequirement > scheme.cap){
    exceedsCap = true;
    cappedLoan = scheme.cap;
  }

  state.finance = {
    margin, projectCost, loan: cappedLoan, rawLoan: loanRequirement,
    scheme, exceedsCap, outOfRange
  };
  state.emiInputs.amount = Math.round(cappedLoan);
  state.emiInputs.rate = scheme.rate;
  state.emiInputs.tenure = scheme.tenureYears;
  state.emiInputs.moratorium = scheme.moratoriumMonths;
  return state.finance;
}

function stepperHTML(current){
  const labels = [
    t('assessment.step1Head').replace(/^\d+\.\s*/,''),
    t('assessment.step2Head').replace(/^\d+\.\s*/,''),
    t('assessment.step3Head').replace(/^\d+\.\s*/,''),
    t('assessment.step4Head').replace(/^\d+\.\s*/,''),
    t('assessment.step5Head').replace(/^\d+\.\s*/,'')
  ];
  return `<div class="stepper">${labels.map((s,i)=>{
    const n=i+1;
    const cls = n<current?'done':(n===current?'active':'');
    const line = i<labels.length-1 ? '<div class="line"></div>' : '';
    return `<div class="step ${cls}"><div class="num">${n<current?'✓':n}</div>${s}</div>${line}`;
  }).join('')}</div>`;
}

function runProcessingAnimation(){

function recalcScheme(val){

}

function computeAmortization(principal, annualRatePct, tenureYears, moratoriumMonths, frequency){
  const totalMonths = Math.round(tenureYears*12);
  const repayMonths = Math.max(totalMonths - moratoriumMonths, 1);
  const periodsPerYear = frequency==='quarterly' ? 4 : 12;
  const periodMonths = frequency==='quarterly' ? 3 : 1;
  const numPeriods = Math.max(Math.round(repayMonths/periodMonths),1);
  const periodRate = (annualRatePct/100)/periodsPerYear;

  let payment;
  if(periodRate===0){ payment = principal/numPeriods; }
  else { payment = principal * periodRate * Math.pow(1+periodRate,numPeriods) / (Math.pow(1+periodRate,numPeriods)-1); }

  let balance = principal;
  const schedule = [];
  for(let i=1;i<=numPeriods;i++){
    const interest = balance*periodRate;
    let principalPaid = payment - interest;
    if(i===numPeriods){ principalPaid = balance; payment = principalPaid+interest; }
    balance = Math.max(balance - principalPaid,0);
    schedule.push({period:i, principal:principalPaid, interest, payment:principalPaid+interest, balance});
  }
  const totalPayment = schedule.reduce((s,r)=>s+r.payment,0);
  const totalInterest = schedule.reduce((s,r)=>s+r.interest,0);
  return {emi:schedule[0]?schedule[0].payment:0, totalInterest, totalRepayment:totalPayment, schedule, numPeriods, periodMonths};
}

  return `
  <div class="topbar-inline">
    <div>
      <div class="section-eyebrow">${t('nav.plan')}</div>
      <h2 class="section-title">${getCategoryName(cat)} Business Plan</h2>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary btn-sm" onclick="alert('Business plan generated and verified.')">Generate Report</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">Print Dossier</button>
    </div>
  </div>
  ${sections.map(s=>`<details class="plan-section"><summary>${s[0]}</summary><div class="pbody">${s[1]}</div></details>`).join('')}
  `;
}

let adminCharts = [];
function drawAdminCharts(){
  if(typeof Chart==='undefined') return;
  adminCharts.forEach(c=>c.destroy()); adminCharts=[];
  const c1 = document.getElementById('adminChart1');
  if(c1) adminCharts.push(new Chart(c1.getContext('2d'), {type:'bar', data:{labels:['Dairy','Agri','Retail','Textiles','Fisheries','Food','Repair','Transport','Digital'], datasets:[{label:'Applications', data:[210,175,160,95,60,140,80,55,72], backgroundColor:'#1E40AF'}]}, options:{plugins:{legend:{display:false}}}}));
  const c2 = document.getElementById('adminChart2');
  if(c2) adminCharts.push(new Chart(c2.getContext('2d'), {type:'bar', data:{labels:['Kamrup','Nagaon','Barpeta','Jorhat','Sonitpur'], datasets:[{label:'Assessments', data:[240,190,160,145,132], backgroundColor:'#2563EB'}]}, options:{plugins:{legend:{display:false}}}}));
  const c3 = document.getElementById('adminChart3');
  if(c3) adminCharts.push(new Chart(c3.getContext('2d'), {type:'doughnut', data:{labels:['Micro Finance Scheme','Term Loan Scheme'], datasets:[{data:[38,62], backgroundColor:['#3B82F6','#1E40AF']}]}}));
  const c4 = document.getElementById('adminChart4');
  if(c4) adminCharts.push(new Chart(c4.getContext('2d'), {type:'doughnut', data:{labels:['Low Risk','Medium Risk','High Risk'], datasets:[{data:[55,32,13], backgroundColor:['#059669','#D97706','#DC2626']}]}}));
}

function finishProfileSetup(){
  const marginEl = document.getElementById('marginInput');
  const margin = marginEl ? Number(marginEl.value)||100000 : 100000;
  state.user.marginCapital = margin;
  state.loggedIn = true; state.role='entrepreneur';
  computeFinance(margin);
  navigate('dashboard');
}
